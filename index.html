<body>
<div id="app"></div>

<input type="file" id="fileIn" hidden
  accept=".pdf,.docx,.doc,.odt,.rtf,.txt,.text,.md,.fdx,.fountain,.spmd,.html,.htm,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.oasis.opendocument.text,application/rtf,image/*">
<input type="file" id="camIn" hidden accept="image/*" capture="environment">
<input type="file" id="galIn" hidden accept="image/*" multiple>
<input type="file" id="coverIn" hidden accept="image/*">
